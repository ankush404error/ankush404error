name: Refresh profile contribution art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch public contribution calendar
        run: python scripts/fetch_contributions.py
      - name: Render animated SVG
        run: python scripts/render_heatmap_svg.py
      - name: Commit updated heatmap
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile contribution art [skip ci]"
          file_pattern: "data/contributions.json assets/contrib-heatmap.svg"
